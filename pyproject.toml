[project]
name = "knowledge-master"
version = "0.2.0"
description = "Local markdown ebook editor and workspace manager built with Python and NiceGUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "pywebview[qt]>=5.0.0",
    "pydantic>=2.7.0",
    "gitpython>=3.1.40",
    "platformdirs>=4.2.0",
    "natsort>=8.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
knowledge-master = "ebook_editor.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_editor"]
